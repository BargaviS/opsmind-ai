[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/evaluate.py" = ["E501"]   # report tables are long lines
"tests/conftest.py" = ["E402"]   # env var must be set before importing the app

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
